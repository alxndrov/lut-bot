<script>
  // Отчёт о сбоях загрузки: ошибки JS и «не загрузились за 8 с» уходят в журнал бота
  // (POST /api/course/log), чтобы видеть, на чём застревает приложение у пользователя
  (function () {
    var t0 = Date.now(), sent = 0;
    window.__appLog = function (kind, msg) {
      if (sent++ > 5) return;
      try {
        var body = JSON.stringify({ kind: kind, msg: String(msg).slice(0, 500), t: Date.now() - t0,
                                    ua: navigator.userAgent, ready: document.readyState });
        navigator.sendBeacon ? navigator.sendBeacon('/api/course/log', body)
                             : fetch('/api/course/log', { method: 'POST', body: body, keepalive: true });
      } catch (e) {}
    };
    window.addEventListener('error', function (e) {
      __appLog('error', (e.message || 'resource') + ' @ ' + (e.filename || (e.target && (e.target.src || e.target.href)) || '') + ':' + (e.lineno || ''));
    }, true);
    window.addEventListener('unhandledrejection', function (e) { __appLog('promise', e.reason && (e.reason.stack || e.reason)); });
    setTimeout(function () { if (!window.__appLoaded) __appLog('timeout', 'stage=' + (window.__appStage || 'head')); }, 8000);
  })();
</script>

<style>
  :root {
    --bg: #0a0a0a;
    --card: #141414;
    --card-2: #1a1a1a;
    --line: #1f1f1f;
    --border: #262626;
    --text: #f2f2f2;
    --dim: #a3a3a3;
    --hint: #7a7a7a;
    --mute: #3a3a3a;
    --red: #e10600;
    --display: 'Anybody', 'Unbounded', 'Arial Black', sans-serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); }
  body { margin: 0; color: var(--text); font: 15px/1.45 var(--sans);
         -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  main { max-width: 480px; margin: 0 auto; padding: 18px 20px calc(96px + var(--safe-b)); }

  /* ── типографика ── */

             margin: 0 0 8px; }
  .eyebrow.red { color: var(--red); }
  .display { font-family: var(--display); font-weight: 900; font-stretch: 150%;
             text-transform: uppercase; line-height: .94; letter-spacing: -.01em; margin: 0; }
  h1.display { font-size: 34px; }
  h1.display span { display: block; }
  h1.display .dim { color: #7a7a7a; }
  .lead { color: var(--dim); margin: 14px 0 0; font-size: 15px; }
  .section-title { margin: 30px 0 0; padding-bottom: 12px; border-bottom: 1px solid var(--line); }

  /* ── шапка главной ── */
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 26px; }
  .who { display: inline-flex; align-items: center; gap: 9px; padding: 5px 14px 5px 5px;
         border: 1px solid var(--border); border-radius: 999px; font-weight: 600; font-size: 14px; }
  .who i { width: 26px; height: 26px; border-radius: 50%; background: var(--red); color: #fff;
           display: grid; place-items: center; font-style: normal; font-size: 12px; font-weight: 700; }
  .top .eyebrow { margin: 0; }

  /* ── карточки и кнопки ── */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 20px;
          padding: 18px; margin-top: 22px; }
  .hero-row { display: flex; align-items: center; gap: 14px; margin-top: 4px; }
  .big-num { font-family: var(--display); font-weight: 900; font-stretch: 150%; color: var(--red);
             font-size: 44px; line-height: .9; letter-spacing: -.02em; flex: none; }
  .hero-row b { display: block; font-family: var(--display); font-weight: 900; font-stretch: 150%;
                text-transform: uppercase; font-size: 15px; line-height: 1.05; }
  .hero-row small { display: block; color: var(--dim); font-size: 13px; margin-top: 4px; }
  .bar { height: 3px; background: #262626; border-radius: 2px; margin: 16px 0 0; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--red); }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
         border: 0; border-radius: 999px; min-height: 48px; padding: 12px 18px; margin-top: 16px;
         font-weight: 600; font-size: 16px; background: #f2f2f2; color: #0a0a0a; text-decoration: none; }

  .btn svg { width: 16px; height: 16px; }
  .price-old { color: var(--hint); text-decoration: line-through; font-size: 14px; margin-left: 8px; }
  .note { color: var(--dim); font-size: 13px; margin: 12px 0 0; }
  .note.ok { color: #8ad3a0; }

  /* ── списки ── */
  .rows { list-style: none; margin: 0; padding: 0; }
  .row { display: flex; align-items: center; gap: 16px; padding: 18px 0; border-bottom: 1px solid var(--line);
         background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; }
  .row .n { color: var(--hint); font-size: 13px; width: 20px; flex: none; }
  .row .main { flex: 1; min-width: 0; }
  .row .main b { display: block; font-family: var(--display); font-weight: 900; font-stretch: 150%;

  .row .main small { display: block; color: var(--dim); font-size: 13px; margin-top: 4px; }
  .row .arrow { color: var(--dim); flex: none; width: 18px; height: 18px; }

  .lessons .row { padding: 16px 0; gap: 14px; }

  .back svg { width: 18px; height: 18px; }
  .video { position: relative; aspect-ratio: 16 / 10; background: var(--card); border: 1px solid var(--border);

  .video .label { position: absolute; left: 16px; top: 14px; font-size: 11px; letter-spacing: .16em;

  .video .play { width: 64px; height: 64px; border-radius: 50%; background: var(--red);

  .video .soon { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center; color: var(--hint);
                 font-size: 12px; }
  .video.player { aspect-ratio: 16 / 9; background: #000; }
  .video.player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .video.player.tall { aspect-ratio: 4 / 3; }
  /* ID зрителя поверх ролика: не мешает нажатиям, раз в 20 с переезжает */
  .wm { position: absolute; z-index: 3; pointer-events: none; color: #fff; opacity: .28; font-size: 12px;

  .fs-btn { position: absolute; z-index: 4; right: 10px; top: 10px; width: 34px; height: 34px; border-radius: 10px;
            border: 0; background: rgba(0,0,0,.55); color: #fff; display: grid; place-items: center; }
  .fs-btn svg { width: 18px; height: 18px; }
  /* Свой полный экран: разворачиваем блок целиком (плеер + ID), на телефоне
     в портрете поворачиваем горизонтальный ролик на 90° */
  .video.player.fs { position: fixed; inset: 0; z-index: 100; aspect-ratio: auto; border-radius: 0; border: 0;
                     margin: 0; width: 100vw; height: 100vh; }
  /* размеры повёрнутого блока ставит fsLayout() в пикселях: 100vh в WebView айфона врёт */
  .video.player.fs.rot { inset: auto; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(90deg); }
  .video.player.fs.rot.ccw { transform: translate(-50%, -50%) rotate(-90deg); }
  .video.player.fs:not(.rot) .fs-btn { top: calc(10px + var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px)); }

  .btn.ghost { background: none; border: 1px solid var(--border); color: var(--text); margin-top: 14px; }
  /* Содержание урока: таймкоды, как в описании на ютубе — нажал и ролик перемотался */
  .chapters { margin-top: 14px; border-top: 1px solid var(--line); }
  .chapters .ch { width: 100%; display: flex; gap: 14px; align-items: baseline; padding: 13px 0; background: none;

                  font: inherit; font-size: 15px; line-height: 1.35; cursor: pointer; }
  .chapters .ch .tc { color: var(--red); font-weight: 600; font-variant-numeric: tabular-nums; min-width: 44px; flex: none; }
  .chapters .ch.on .t { font-weight: 600; }
  .group-title { margin-top: 26px; margin-bottom: -2px; }
  .faq { margin-top: 18px; border-top: 1px solid var(--line); }
  .faq details { border-bottom: 1px solid var(--line); }
  .faq summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 14px; padding: 18px 0;

  .faq summary::-webkit-details-marker { display: none; }
  .faq summary .t { flex: 1; }

  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }

  .next-card { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + var(--safe-b));

  /* ── разбор ── */
  label.field { display: block; margin-top: 22px; }

  .input { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 16px;

  .wordmark { margin: 54px -20px 0; overflow: hidden; height: min(8.5vw, 42px); position: relative; }
  .wordmark div { font-family: var(--display); font-weight: 900; font-stretch: 150%; color: var(--red);
                  font-size: min(12vw, 57px); line-height: 1; text-align: center; letter-spacing: -.02em; white-space: nowrap;
                  -webkit-mask-image: linear-gradient(#000 35%, transparent 100%);
                  mask-image: linear-gradient(#000 35%, transparent 100%); }

  /* ── тест-режим (только админы) ── */
  .test { border: 1px dashed #4a3a00; background: #141108; }
  .test .eyebrow { color: #e0b100; }
  .test .btn { margin-top: 10px; min-height: 42px; font-size: 14px; }
  .test .toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px;
                  margin-top: 14px; font-size: 14px; }
  .switch { width: 46px; height: 28px; border-radius: 999px; background: #333; border: 0; position: relative; flex: none; }
  .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px;
                   border-radius: 50%; background: #fff; transition: left .15s; }
  .switch.on { background: var(--red); }
  .switch.on::after { left: 21px; }
  .pill { display: inline-block; font-size: 10px; letter-spacing: .12em; padding: 3px 7px; border-radius: 6px;

          font-weight: 600; font-stretch: 100%; }

  /* ── нижние вкладки ── */
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(10,10,10,.96);
             border-top: 1px solid var(--line); display: flex; justify-content: center;
             padding: 8px 0 calc(8px + var(--safe-b)); backdrop-filter: blur(10px); z-index: 5; }
  nav.tabs .in { display: flex; width: 100%; max-width: 480px; }
  nav.tabs button { flex: 1; background: none; border: 0; color: var(--hint); display: flex; flex-direction: column;
                    align-items: center; gap: 4px; font-size: 12px; padding: 4px 0; }
  nav.tabs button svg { width: 22px; height: 22px; }
  nav.tabs button.on { color: var(--text); font-weight: 600; }
  nav.tabs button[hidden] { display: none; }

  .muted { text-align: center; color: var(--hint); padding: 80px 12px; }
  .toast { position: fixed; left: 50%; bottom: calc(90px + var(--safe-b)); transform: translateX(-50%);
           background: #f2f2f2; color: #0a0a0a; padding: 10px 16px; border-radius: 12px; font-size: 14px;
           font-weight: 600; z-index: 10; opacity: 0; transition: opacity .2s; pointer-events: none;
           max-width: calc(100% - 40px); text-align: center; }
  .toast.on { opacity: 1; }
</style>

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function rub(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ₽'; }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function plural(n, one, few, many) {
    var m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;

  // ── рендер и навигация ──
  function render() {
    var h;
    if (view.screen === 'section') h = screenSection(view.section);
    else if (view.screen === 'lesson') h = screenLesson(view.section, view.lesson);
    else if (view.tab === 'materials') h = screenMaterials();
    else if (view.tab === 'review' && data.review_tab) h = screenReview();
    else if (view.tab === 'faq') h = screenFaq();
    else h = screenHome();
    if (fsOn) fsExit();
    root.innerHTML = h;
    tabsEl.hidden = false;
    setupPlayer();
    var reviewBtn = tabsEl.querySelector('[data-tab="review"]');
    if (reviewBtn) reviewBtn.hidden = !data.review_tab;
    [].forEach.call(tabsEl.querySelectorAll('button'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-tab') === view.tab);
    });
    if (tg && tg.BackButton) { view.screen ? tg.BackButton.show() : tg.BackButton.hide(); }
  }
  function go(target) {
    var p = target.split(':');
    view.screen = p[0]; view.section = p[1]; view.lesson = p[2] ? +p[2] : null;
    view.tab = 'lessons';
    render(); window.scrollTo(0, 0);
  }
  // ── плеер урока: ID зрителя, свой полный экран, отметка просмотра ──
  var wmTimer = null, fsOn = false, fsNative = false, viewSent = {};
  var player = null, playerReady = false, pendingSeek = null;
  // Перемотка по таймкоду: плеер ещё не готов — запомним и перемотаем, когда будет
  function seekTo(sec) {
    var box = document.getElementById('player');
    if (box) box.scrollIntoView({ behavior: 'smooth', block: 'start' });
    if (!player || !playerReady) { pendingSeek = sec; return; }
    try { player.setCurrentTime(sec); player.play(); } catch (e) { __appLog('seek', e && e.message); }
  }
  function chapterMark(sec) {
    var all = document.querySelectorAll('.chapters .ch'), cur = null;
    for (var i = 0; i < all.length; i++) if (+all[i].getAttribute('data-seek') <= sec + 0.5) cur = all[i];
    for (var j = 0; j < all.length; j++) all[j].classList.toggle('on', all[j] === cur);
  }
  function setupPlayer() {
    clearInterval(wmTimer); wmTimer = null;
    player = null; playerReady = false; pendingSeek = null;
    var box = document.getElementById('player');
    if (!box) return;
    var wm = document.getElementById('wm');
    var spots = [[6, 7], [58, 9], [8, 72], [56, 76], [32, 42]], at = Math.floor(Math.random() * spots.length);
    var move = function () {
      at = (at + 1 + Math.floor(Math.random() * (spots.length - 1))) % spots.length;
      wm.style.left = spots[at][0] + '%'; wm.style.top = spots[at][1] + '%';
    };
    move(); wmTimer = setInterval(move, 20000);
    var slug = view.section, n = view.lesson, key = slug + ':' + n;
    if (demo || !window.playerjs) return;
    try {
      var p = player = new playerjs.Player(document.getElementById('lesson-video'));
      p.on('ready', function () {
        if (player !== p) return;
        playerReady = true;
        if (pendingSeek !== null) { var at = pendingSeek; pendingSeek = null; seekTo(at); }
        if (document.querySelector('.chapters')) {
          var last = -1;
          p.on('timeupdate', function (d) {
            var sec = Math.floor((d && d.seconds) || 0);
            if (sec !== last) { last = sec; chapterMark(sec); }
          });
        }
        p.on('play', function () {
          if (viewSent[key]) return;
          viewSent[key] = true;
          api('/api/course/view', { section: slug, lesson: n }).catch(function () { viewSent[key] = false; });
        });
      });
    } catch (e) { __appLog('playerjs', e && (e.stack || e.message)); }
  }
  // Полный экран: сначала просим у Telegram (Bot API 8.0 — телефоны и новые десктопы),
  // не вышло — браузерный полный экран блока, а нет и его — блок на всё окно приложения.
  // Поворот на 90° — только на телефоне: на компьютере узкое окно не повод крутить видео
  var fsVia = null;   // 'tg' | 'el' | null — чем развернули
  function mobile() { return /^(ios|android)/.test((tg && tg.platform) || '') || (!tg && 'ontouchstart' in window); }
  function tgFsOk() { return !!(tg && tg.isVersionAtLeast && tg.isVersionAtLeast('8.0') && tg.requestFullscreen); }
  function fsLayout() {
    var box = document.getElementById('player');
    if (!box) return;
    var rot = fsOn && mobile() && !box.classList.contains('tall') && innerHeight > innerWidth * 1.1;
    box.classList.toggle('rot', rot);
    box.classList.toggle('ccw', rot && rotCcw);
    // повёрнутый блок: ширина = высоте окна, высота = ширине (inset в CSS не задаёт размер после поворота)
    box.style.width = rot ? innerHeight + 'px' : '';
    box.style.height = rot ? innerWidth + 'px' : '';
  }
  function fsIcon() {
    var b = document.querySelector('[data-fs]');
    if (b) b.innerHTML = fsOn ? ICON.fsOff : ICON.fs;
  }
  function fsElement() {
    var box = document.getElementById('player');
    if (!fsOn || !box || !box.requestFullscreen || document.fullscreenElement) return;
    try {
      var pr = box.requestFullscreen();
      fsVia = 'el';
      pr && pr.catch && pr.catch(function () { if (fsVia === 'el') fsVia = null; });
    } catch (e) { fsVia = null; }
  }
  // На телефоне в полном экране не даём Telegram перейти в альбомный режим (там он
  // рисует свои поля по краям) — держим портрет и сами поворачиваем видео. Куда
  // повернуть — по датчику: телефон наклонён правым краем вниз → видео на −90°
  var rotCcw = false;
  function tg8() { return !!(tg && tg.isVersionAtLeast && tg.isVersionAtLeast('8.0')); }
  function orientStart() {
    if (!mobile() || !tg8()) return;
    try { if (innerHeight > innerWidth) tg.lockOrientation(); } catch (e) {}
    try { tg.DeviceOrientation && tg.DeviceOrientation.start({ refresh_rate: 200 }); } catch (e) {}
  }
  function orientStop() {
    if (!tg8()) return;
    try { tg.unlockOrientation(); } catch (e) {}
    try { tg.DeviceOrientation && tg.DeviceOrientation.isStarted && tg.DeviceOrientation.stop(); } catch (e) {}
  }
  if (tg && tg.onEvent) tg.onEvent('deviceOrientationChanged', function () {
    var g = tg.DeviceOrientation && tg.DeviceOrientation.gamma;   // радианы, наклон влево-вправо
    if (typeof g !== 'number' || !fsOn) return;
    var ccw = g > 0.7 ? true : g < -0.7 ? false : rotCcw;
    if (ccw !== rotCcw) { rotCcw = ccw; fsLayout(); }
  });
  function fsEnter() {
    var box = document.getElementById('player');
    if (!box) return;
    fsOn = true; fsVia = null;
    box.classList.add('fs'); document.body.classList.add('fs-on');
    orientStart();
    if (tgFsOk()) { try { tg.requestFullscreen(); } catch (e) { fsElement(); } }
    else fsElement();
    fsLayout(); fsIcon();
  }
  function fsExit() {
    var box = document.getElementById('player');
    fsOn = false;
    if (box) { box.classList.remove('fs', 'rot', 'ccw'); box.style.width = ''; box.style.height = ''; }
    orientStop();
    document.body.classList.remove('fs-on');
    try { if (tg && tg.isFullscreen) tg.exitFullscreen(); } catch (e) {}
    try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
    fsVia = null; fsIcon();
  }
  window.addEventListener('resize', fsLayout);
  document.addEventListener('fullscreenchange', function () { if (fsOn && fsVia === 'el' && !document.fullscreenElement) fsExit(); });
  if (tg && tg.onEvent) {
    tg.onEvent('fullscreenChanged', function () {
      if (tg.isFullscreen) { if (fsOn) fsVia = 'tg'; }
      else if (fsOn && fsVia === 'tg') fsExit();   // свернули жестом/кнопкой Telegram
      fsLayout();
    });
    tg.onEvent('viewportChanged', fsLayout);
    // Telegram не умеет на этой платформе (или уже) — пробуем браузерный полный экран
    tg.onEvent('fullscreenFailed', function () { fsElement(); });
  }

  function sendFiles(extra, one) {
    if (demo) return toast('Демо: бот прислал бы файл в чат');
    haptic('medium');
    toast('Отправляем…');
    api('/api/course/file', extra).then(function (r) {
      toast(r.sent > 1 ? 'Прислали ' + r.sent + ' ' + plural(r.sent, 'файл', 'файла', 'файлов') + ' в чат с ботом ✓' : 'Прислали в чат с ботом ✓');
    }).catch(function (e) { toast(e.message || 'Не получилось'); });
  }

  function back() {
    if (fsOn) { fsExit(); return; }
    if (view.screen === 'lesson') { view.screen = 'section'; view.lesson = null; }
    else { view.screen = null; view.section = null; }
    render(); window.scrollTo(0, 0);
  }
  function setTab(tab) {
    view.tab = tab; view.screen = null; view.section = null; view.lesson = null;
    render(); window.scrollTo(0, 0);
  }

  function run(promise, okText) {
    busy = true;
    return promise.then(function (d) { if (d) { data = d; render(); } if (okText) toast(okText); })
      .catch(function (e) { toast(e.message || 'Не получилось'); })
      .then(function () { busy = false; });
  }

  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('button, a');
    if (!el || busy) return;
    if (el.hasAttribute('data-tab')) { haptic(); setTab(el.getAttribute('data-tab')); }
    else if (el.hasAttribute('data-tab-go')) { haptic(); setTab(el.getAttribute('data-tab-go')); }
    else if (el.hasAttribute('data-go')) { haptic(); go(el.getAttribute('data-go')); }
    else if (el.hasAttribute('data-back')) { back(); }
    else if (el.hasAttribute('data-fs')) { haptic(); fsOn ? fsExit() : fsEnter(); }
    else if (el.hasAttribute('data-seek')) { haptic(); seekTo(+el.getAttribute('data-seek') || 0); }
    else if (el.hasAttribute('data-file')) { sendFiles({ key: el.getAttribute('data-file') }); }
    else if (el.hasAttribute('data-lesson-files')) { sendFiles({ lesson: el.getAttribute('data-lesson-files') }); }
    else if (el.hasAttribute('data-soon')) { toast(data.open ? 'Скоро добавим' : 'Откроется ' + data.open_date); }
    else if (el.hasAttribute('data-buy')) { buy(); }
    else if (el.hasAttribute('data-locked')) {
      var s = section(view.section);
      toast(s && s.owned ? 'Откроется ' + data.open_date : 'Урок откроется после покупки');
    }
    else if (el.hasAttribute('data-preview')) {
      previewOpen = !previewOpen;
      try { localStorage.setItem('previewOpen', previewOpen ? '1' : '0'); } catch (e) {}
      haptic(); demo ? (data = demoData(), render()) : run(api('/api/course/me'));
    }
    else if (el.hasAttribute('data-test-pay')) {
      if (demo) return toast('Демо: в Telegram тут пройдёт тестовая оплата');
      haptic('medium');
      run(api('/api/course/test', { action: 'pay', option_id: +el.getAttribute('data-test-pay') }),
          'Тестовая оплата прошла — сообщение в боте');
    }
    else if (el.hasAttribute('data-test-reset')) {
      if (demo) return toast('Демо: в Telegram тут сбросится тест');
      haptic('medium');
      run(api('/api/course/test', { action: 'reset' }), 'Тестовый доступ снят');
    }
    else if (el.hasAttribute('data-call')) {
      if (demo) return toast('Демо: запрос ушёл бы админам');
      haptic('medium');
      run(api('/api/course/call'), 'Запрос отправлен — напишем тебе');
    }
    else if (el.hasAttribute('data-review')) {
      var link = document.getElementById('rv-link').value.trim();
      var q = document.getElementById('rv-q').value.trim();
      var err = document.getElementById('rv-err');
      if (!/^https?:\/\//i.test(link)) { err.textContent = 'Вставь ссылку на видео — начинается с https://'; return; }
      if (demo) return toast('Демо: заявка ушла бы админам');
      haptic('medium');
      err.textContent = '';
      run(api('/api/course/review', { link: link, question: q }), 'Ролик отправлен Мише ✓');
    }
  });

  // ── демо-данные для просмотра вне Telegram (#demo) ──
  function demoData() {
    var lessons = function (titles, open) { return titles.map(function (t, i) {
      return { n: i + 1, title: t, open: open, duration: open ? (12 + i * 3) + ' мин' : '', processing: open && i === 1,
               files: open ? [{ key: 'demo' + i, title: 'Шпаргалка к уроку', ext: 'PDF' }] : [] }; }); };
    var open = previewOpen;
    return {
      first_name: 'Миша', admin: true, open: open, preview: open, open_date: '8 ноября', days_left: 32,
      full_price: false, price_stage: 'presale', price_until: '1 ноября',
      sections: [
        { slug: 'shooting', title: 'Shot on iPhone — съёмка', name: 'Shot on iPhone', owned: true, test: true, price: 2490,
          lead: 'Настраиваем камеру, собираем сет и снимаем себя без команды.',
          lessons: lessons(['Blackmagic Camera', 'Оборудование и съёмка себя', 'Линзы', 'Как снимать под лут', 'Мои приёмы и движение камеры'], open) },
        { slug: 'editing', title: 'Cut by MALIMABI — монтаж', name: 'Cut by MALIMABI', owned: false, test: false, price: 2990,
          lead: 'Монтаж в Premiere Pro: от первого проекта до финального рендера.',
          lessons: lessons(['Знакомство с Premiere', 'Отбор', 'Разбор монтажа', 'Музыка и саунд-дизайн', 'Цвет', 'Нейросети', 'Экспорт и Topaz'], false) }
      ],
      bundle: { title: 'Пакет: съёмка + монтаж', price: 4490, price_full: 5990 },
      materials: [
        { group: 'lut', badge: 'LUT', title: 'Авторский лут', items: [{ key: open ? 'lut' : '', title: 'Авторский лут', note: '.cube · для Blackmagic и Premiere' }] }
      ],
      wm: 'ID 123456789', review_tab: true,
      faq: [{ q: 'Где взять Premiere Pro?', a: 'Демо-ответ.\n\n• Пункт один\n• Пункт два' }, { q: 'Доступ навсегда?', a: 'Да.' }],
      review: { eligible: true, test: true, position: null, limit: 10, left: 10, reviewer: 'Миша', sent: false, status: null },
      options: [{ id: 1, title: 'Shot on iPhone — съёмка' }, { id: 2, title: 'Cut by MALIMABI — монтаж' }, { id: 3, title: 'Пакет: съёмка + монтаж' }],
      buy_url: ''
    };
  }

  // ── старт ──
  window.__appStage = 'boot initData=' + !!(tg && tg.initData);
  if (!demo && (!tg || !tg.initData)) {
    window.__appLoaded = true;
    root.innerHTML = '<div class="muted">Открой приложение из бота MALIMABI в Telegram.</div>';
    return;
  }
  if (tg && tg.initData) {
    tg.ready(); tg.expand();
    try { tg.setHeaderColor('#0a0a0a'); tg.setBackgroundColor('#0a0a0a'); tg.setBottomBarColor && tg.setBottomBarColor('#0a0a0a'); } catch (e) {}
    try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
    tg.BackButton.onClick(back);
  }
  window.__appStage = 'api-me';
  load().then(function () { window.__appLoaded = true; }, function (e) { __appLog('load', e && (e.status + ' ' + e.message)); throw e; }).catch(function () {
    root.innerHTML = '<div class="muted">Не получилось загрузить. Закрой приложение и открой снова.</div>';
  });
})();

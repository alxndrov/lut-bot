name: Deploy to server

# Автозапуск на push отключён 2026-08-13 — упирались в лимит Actions
# storage (0.5 GB/мес на бесплатном тарифе). Деплоим прямо на сервере
# (bash deploy.sh) сразу после коммита, без похода через Actions.
# Кнопка ручного запуска оставлена на случай, если понадобится задеплоить
# не с сервера (например, с другой машины без SSH-доступа).
on:
  workflow_dispatch:        # кнопка «запустить вручную» во вкладке Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Обновить бота на сервере
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # Сначала обновляем код, потом запускаем deploy.sh из репозитория.
          # Порядок важен: скрипт деплоя сам лежит в репозитории — деплой
          # не должен зависеть от того, что уже задеплоено.
          # ВАЖНО: секреты SSH_HOST/SSH_USER/SSH_KEY должны указывать на
          # сервер, где реально живёт бот (в марте указывали на старый).
          script: |
            cd $HOME/lut-bot
            git fetch origin main
            git reset --hard origin/main
            bash deploy.sh
          script_stop: true

name: Deploy to server

on:
  push:
    branches:
      - main
  workflow_dispatch:        # кнопка «запустить вручную» во вкладке Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Обновить бота на сервере
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # ВРЕМЕННО: диагностика. /home/<user>/lut-bot на сервере нет —
          # ищем, где на самом деле живёт бот, потом вернём деплой.
          script: |
            whoami; echo "HOME=$HOME"
            ls $HOME 2>/dev/null || true
            systemctl show lut-bot -p FragmentPath -p WorkingDirectory -p ExecStart --no-pager 2>/dev/null || true
            systemctl --user show lut-bot -p FragmentPath -p WorkingDirectory -p ExecStart --no-pager 2>/dev/null || true
            ls -d /home/*/lut-bot 2>/dev/null || true
            sudo -n ls -d /root/lut-bot 2>&1 || true
          script_stop: true

name: Deploy to server

on:
  push:
    branches:
      - main
  workflow_dispatch:        # кнопка «запустить вручную» во вкладке Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Обновить бота на сервере
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # Ключ на сервере привязан к deploy.sh: ничего другого им не запустить,
          # поэтому команду выбирает сам сервер, а не мы отсюда
          script: deploy
          script_stop: true

name: Deploy to server

on:
  push:
    branches:
      - main
  workflow_dispatch:        # кнопка «запустить вручную» во вкладке Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Обновить бота на сервере
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # Скрипт по полному пути: форс-команда `deploy` в authorized_keys
          # на сервере не настроена, и голая команда падала с
          # «command not found». Путь тот же, что внутри deploy.sh.
          script: bash /home/ubuntu/lut-bot/deploy.sh
          script_stop: true

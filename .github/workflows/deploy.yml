name: Deploy to server

on:
  push:
    branches:
      - main
  workflow_dispatch:        # кнопка «запустить вручную» во вкладке Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Обновить бота на сервере
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # Сначала обновляем код, потом запускаем deploy.sh из репозитория.
          # Порядок важен: скрипт деплоя сам лежит в репозитории, и на
          # сервере его может ещё не быть — деплой не должен зависеть
          # от того, что уже задеплоено.
          script: |
            cd /home/ubuntu/lut-bot
            git fetch origin main
            git reset --hard origin/main
            bash deploy.sh
          script_stop: true
